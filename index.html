const data=raw.flatMap((r,s)=>r.split('\n').filter(Boolean).map((full,i)=>({id:`${s+1}-${i+1}`,section:s+1,num:i+1,full,parts:full.split(/[，。]/).map(x=>x.trim()).filter(Boolean),name:full.split(/[，。]/).filter(Boolean).slice(-1)[0]})));
let section=0,selected=data[0],done=new Set(JSON.parse(localStorage.getItem('yang108done')||'[]'));const $=id=>document.getElementById(id);function filtered(){let q=$('search').value.trim();return data.filter(x=>(!section||x.section===section)&&(!q||x.full.includes(q)))}function render(){let arr=filtered();$('list').replaceChildren(...arr.map(x=>{let b=document.createElement('button');b.className='item'+(selected.id===x.id?' active':'');b.innerHTML=`<small>第${x.section}節 · 單元 ${x.num} ${done.has(x.id)?'✓':''}</small>`;b.append(document.createTextNode(x.name));b.onclick=()=>{selected=x;render()};return b}));$('count').textContent=`(${arr.length} 單元)`;$('meta').textContent=`第 ${selected.section} 節 · 練習單元 ${selected.num}`;$('name').textContent=selected.name;$('full').textContent=selected.full;$('chips').replaceChildren(...selected.parts.map(t=>{let e=document.createElement('span');e.className='chip';e.textContent=t;return e}));$('done').textContent=done.has(selected.id)?'✓ 已完成':'✓ 標記完成';$('pct').textContent=`${done.size}/${data.length}`;$('bar').style.width=done.size/data.length*100+'%';document.querySelectorAll('.section').forEach(b=>b.classList.toggle('active',Number(b.dataset.s)===section));$('all').classList.toggle('active',!section)}function navigate(d){let a=filtered(),i=a.findIndex(x=>x.id===selected.id);if(a.length){selected=a[Math.max(0,Math.min(a.length-1,i+d))]||a[0];render()}}$('all').onclick=()=>{section=0;render()};document.querySelectorAll('.section').forEach(b=>b.onclick=()=>{section=+b.dataset.s;selected=filtered()[0]||selected;render()});$('search').oninput=()=>{let a=filtered();if(a.length&&!a.includes(selected))selected=a[0];render()};$('prev').onclick=()=>navigate(-1);$('next').onclick=()=>navigate(1);$('done').onclick=()=>{done.has(selected.id)?done.delete(selected.id):done.add(selected.id);localStorage.setItem('yang108done',JSON.stringify([...done]));render()};$('rate').oninput=()=>{$('rateLabel').textContent=$('rate').value+'×'};$('speak').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(selected.full);u.lang='zh-TW';u.rate=+$('rate').value;u.pitch=+$('pitch').value;const v=speechSynthesis.getVoices().find(v=>v.voiceURI===$('voiceSelect').value);if(v)u.voice=v;speechSynthesis.speak(u)};$('stop').onclick=()=>speechSynthesis.cancel();$('print').onclick=()=>window.print();
let audioCtx=null,musicGain=null,musicTimer=null,musicIndex=0;
const pentatonic=[196,220,261.63,293.66,329.63,392,440,523.25,587.33];
function musicNote(){if(!audioCtx||audioCtx.state!=='running')return;const now=audioCtx.currentTime;const f=pentatonic[[0,2,4,5,3,1,2,0,4,6,5,2][musicIndex++%12]];for(const [freq,level,duration] of [[f,.13,3.5],[f/2,.055,4.5]]){let o=audioCtx.createOscillator(),g=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();o.type='sine';o.frequency.value=freq;filter.type='lowpass';filter.frequency.value=1100;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(level,now+.28);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(filter).connect(g).connect(musicGain);o.start(now);o.stop(now+duration+.1)}}
$('music').onclick=async()=>{if(musicTimer){clearInterval(musicTimer);musicTimer=null;if(audioCtx)await audioCtx.suspend();$('music').textContent='♫ 播放背景音樂';return}if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();musicGain=audioCtx.createGain();musicGain.gain.value=+$('musicVolume').value/100;musicGain.connect(audioCtx.destination)}await audioCtx.resume();musicNote();musicTimer=setInterval(musicNote,2300);$('music').textContent='Ⅱ 暫停背景音樂'};
$('musicVolume').oninput=()=>{if(musicGain)musicGain.gain.setTargetAtTime(+$('musicVolume').value/100,audioCtx.currentTime,.05)};
function loadVoices(){if(!('speechSynthesis'in window))return;const old=$('voiceSelect').value;const list=speechSynthesis.getVoices().filter(v=>/zh|chinese|mandarin/i.test(v.lang+' '+v.name));$('voiceSelect').replaceChildren(new Option('系統中文聲線',''),...list.map(v=>new Option(v.name+' ('+v.lang+')',v.voiceURI)));$('voiceSelect').value=old;if(!$('voiceSelect').value&&list.length){const preferred=list.find(v=>/male|男/i.test(v.name))||list.find(v=>v.lang==='zh-TW')||list[0];$('voiceSelect').value=preferred.voiceURI}}
loadVoices();if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=loadVoices;
render();
</script></body></html>
